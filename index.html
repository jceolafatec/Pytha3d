<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>3D Portfolio – GLTF Viewer 2.0</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="logo">GLTF Viewer <span class="accent">2.0</span></div>
    <nav class="site-nav">
      <a class="nav-link active" href="index.html">Portfolio</a>
    </nav>
  </header>

  <main class="container">
    
    <section class="hero">
      <h1>Your 3D Model Portfolio</h1>
      <p>Browse interactive GLTF/GLB models exported from Pytha.</p>
    </section>

    <section class="controls">
      <input
        id="searchInput"
        class="search-input"
        type="search"
        placeholder="Search by name or tag..."
      />
      <div id="tagFilters" class="tag-filters"></div>
    </section>

    <section>
      <div id="modelsGrid" class="models-grid"></div>
      <div id="emptyState" class="empty-state" hidden>
        No models match your search yet.
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <span>GLTF Viewer 2.0 · Built for 3D model portfolios</span>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
