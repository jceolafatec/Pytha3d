<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer – GLTF Viewer 2.0</title>

    <!-- Global site styles -->
    <link rel="stylesheet" href="assets/css/styles.css">

    <!-- Three.js + loaders + controls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.7/dat.gui.min.js"></script>

    <!-- Local viewer styles -->
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #040509;
            color: #e3e7f0;
        }
        #viewer-container {
            position: relative;
            width: 100%;
            height: 70vh;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
            background: #111;
        }
        #model-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 12px 18px;
            background: rgba(0,0,0,0.7);
            color: white;
            border-radius: 6px;
            font-size: 0.9rem;
        }
        #error {
            position: absolute;
            top: 16px;
            left: 16px;
            padding: 10px;
            background: rgba(0,0,0,0.75);
            color: #ff6b6b;
            border-radius: 6px;
            display: none;
            max-width: 340px;
            font-size: 0.85rem;
        }
        #controls {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        #controls button {
            background: #222;
            border: 1px solid #444;
            color: #eee;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        #controls button:hover {
            background: #333;
        }
        #group-controls {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 6px;
            max-height: 60vh;
            overflow-y: auto;
            display: none;
        }
        #group-controls h3 {
            margin: 0 0 10px;
        }
        .group-toggle {
            margin-bottom: 5px;
        }
        .group-toggle label {
            margin-left: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header class="site-header">
        <div class="logo">GLTF Viewer <span class="accent">2.0</span></div>
        <nav class="site-nav">
            <a class="nav-link" href="index.html">Back to portfolio</a>
        </nav>
    </header>

    <main class="container">

        <!-- Model info from models.json -->
        <section class="model-meta">
            <h1 id="modelTitle">Loading...</h1>
            <p id="modelDescription"></p>
            <p><strong>Source file:</strong> <span id="modelFilePath"></span></p>
            <div id="modelTags" class="model-tags"></div>
        </section>

        <!-- Main Viewer -->
        <section aria-label="3D Viewer">
            <div id="viewer-container">
                <div id="error"></div>
                <div id="loading">Loading 3D model...</div>

                <!-- Buttons -->
                <div id="controls">
                    <button onclick="toggleWireframe()">Toggle Wireframe</button>
                    <button onclick="resetCamera()">Reset View</button>
                    <button onclick="toggleGroupControls()">Toggle Groups</button>
                </div>

                <!-- Group controls -->
                <div id="group-controls">
                    <h3>Group Visibility</h3>
                    <div id="group-toggles"></div>
                </div>

                <!-- Canvas -->
                <canvas id="model-canvas"></canvas>
            </div>
        </section>

        <!-- Related models -->
        <section class="related-section" style="margin-top:2rem;">
            <h2>More models</h2>
            <div id="relatedModels" class="models-grid small"></div>
        </section>

    </main>

    <footer class="site-footer">
        <span>GLTF Viewer 2.0 · Three.js powered viewer</span>
    </footer>

    <!-- Load your viewer logic -->
    <script src="assets/js/viewer.js"></script>

</body>
</html>
